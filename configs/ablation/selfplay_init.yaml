# ============================================================================
# 消融实验 A 臂：纯自博弈初始化（无外部预训练对手）
#
# 单进程两阶段（stage1 -> battle），臂内唯一变量 = battle 阶段的对手池初始化：
#   * stage1（300k 步，纯飞行控制预训练）：对手池 = base_opponent_model 的 1/2/3，
#     与对照（BDC-MLP）以及 B 臂**完全一致**，保证各臂 ego 预训练相同。
#   * battle（30 cycles × 10M 步）：对手池 = **本 run 自己的 stage1 ckpt**（单一成员），
#     whitelist 为空 -> 无受保护对手，4 个槽位全部可替换（stage1 种子从第 2 轮起即可被淘汰）。
#
# 依赖 train.py 的两处向后兼容改动（本 arm 需要，不影响其它配置）：
#   1) stage 级 `opponent_pool:` 段 = battle 阶段覆盖池（会先清空 <run>/opponent_pool 再播种）；
#   2) base_dir 支持特殊值 "@self_stage1" = 用本 run 的 stage1 ckpt 目录作为池来源。
#
# 运行：
#   python -m src.training.train --config configs/ablation/selfplay_init.yaml \
#       --exp_name selfplay_init
# 时长：stage1 ≈ 2 分钟 + 30 cycles ≈ 20 h（实测 MLP 42 min/10M 步）。
# ============================================================================
agent:
  algorithm: PPO
  batch_size: 128
  clip_range: 0.2
  clip_range_vf: null
  device: cuda
  ent_coef: 0.0
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 0.0001
  max_grad_norm: 0.5
  n_epochs: 10
  n_steps: 2048
  name: ppo_1layer
  policy: MlpPolicy
  policy_kwargs:
    net_arch:
    - 12288
    share_features_extractor: true
  verbose: 0
  vf_coef: 0.5
env_base:
  clip_obs: 10.0
  norm_obs: false
  norm_reward: false
  plane: F16
  render_mode: null
  task: TrackingTask
  use_vec_normalize: false
# stage1 使用的池（= 对照同款，两臂共用）
opponent_pool:
  base_dir: ./base_opponent_model
  max_pool_size: 4
  opponents:
  - '1'
  - '2'
  - '3'
  pool_subdir: opponent_pool
  whitelist:
  - '1'
  - '2'
  - '3'
stage1:
  env:
    shape: stage1
  eval_freq: 1000
  log_root: ./experiments
  num_cpu: 30
  seed: 42
  total_timesteps: 300000
stage2:
  battle_cycles: 30
  battle_step: 10000000
  env:
    shape: stage2
  eval_freq: 50000
  log_root: ./experiments
  n_episodes_eval: 50
  num_cpu: 30
  seed: 42
  threshold_timesteps: 20000000
  update_freq_episodes: 1000
  # ---- battle 阶段覆盖池（本 arm 的核心变量）----
  opponent_pool:
    base_dir: "@self_stage1"   # 本 run 自己的 stage1 ckpt 目录
    max_pool_size: 4
    opponents:
    - '1'
    whitelist: []              # 无受保护对手（硬性要求）
