# ============================================================================
#  ★★★ SMOKE TEST ONLY — 非正式实验，不要用于任何结果汇报 ★★★
# ============================================================================
# 由 configs/ablation/selfplay_init.yaml 生成。与正式配置的【唯一】差别：
#   num_cpu 30->4；stage1 total_timesteps 300000->20000；eval_freq ->5000；
#   battle_step 1e7->20000；battle_cycles 30->1；n_episodes_eval 50->2；
#   threshold_timesteps 2e7->20000。其余（含两处 opponent_pool）逐字相同。
# 实验目录名带 _smoke 后缀，可随时删除。
# ============================================================================
agent:
  algorithm: PPO
  batch_size: 128
  clip_range: 0.2
  clip_range_vf: null
  device: cuda
  ent_coef: 0.0
  gae_lambda: 0.95
  gamma: 0.99
  learning_rate: 0.0001
  max_grad_norm: 0.5
  n_epochs: 10
  n_steps: 2048
  name: ppo_1layer
  policy: MlpPolicy
  policy_kwargs:
    net_arch:
    - 12288
    share_features_extractor: true
  verbose: 0
  vf_coef: 0.5
env_base:
  clip_obs: 10.0
  norm_obs: false
  norm_reward: false
  plane: F16
  render_mode: null
  task: TrackingTask
  use_vec_normalize: false
opponent_pool:
  base_dir: ./base_opponent_model
  max_pool_size: 4
  opponents:
  - '1'
  - '2'
  - '3'
  pool_subdir: opponent_pool
  whitelist:
  - '1'
  - '2'
  - '3'
stage1:
  env:
    shape: stage1
  eval_freq: 5000
  log_root: ./experiments
  num_cpu: 4
  seed: 42
  total_timesteps: 20000
stage2:
  battle_cycles: 1
  battle_step: 20000
  env:
    shape: stage2
  eval_freq: 5000
  log_root: ./experiments
  n_episodes_eval: 2
  num_cpu: 4
  seed: 42
  threshold_timesteps: 20000
  update_freq_episodes: 1000
  opponent_pool:
    base_dir: '@self_stage1'
    max_pool_size: 4
    opponents:
    - '1'
    whitelist: []
