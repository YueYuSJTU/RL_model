# 合一配置（紧凑版）：将重复的 agent 与 env 公共部分提到 stage 外

# 所有 stage 共享的 agent 配置
agent:
  algorithm: "RecurrentPPO"
  policy: "MlpLstmPolicy"
  learning_rate: 5.0e-5      # 降低学习率，防止LSTM梯度爆炸
  device: "cuda"
  verbose: 0
  n_steps: 2048              # 恢复长视野，确保GAE优势估计准确
  batch_size: 128            # 确保每次更新有足够的数据
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01             # 稍微加一点熵增益，防止LSTM过早陷入局部最优(极度确定的策略)
  vf_coef: 0.5
  max_grad_norm: 0.5         # 梯度裁剪对LSTM极其重要，保持0.5即可
  policy_kwargs:
    share_features_extractor: False  # Actor和Critic使用独立网络，避免梯度冲突
    lstm_hidden_size: 256            # 控制LSTM隐状态维度
    net_arch:
      pi: [512, 512]                 # 策略网络特征提取
      vf: [512, 512]                 # 价值网络特征提取


