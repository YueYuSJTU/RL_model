# 阶段训练通用配置
stage1:
  agent: ppo_1layer
  env: obs_test2_stage1
  total_timesteps: 300_000 # Train for a fixed number of steps
  eval_freq: 1000
  log_root: "./experiments"
  seed: 42
  num_cpu: 30

stage2:
  agent: ppo_1layer
  env: obs_test2_stage2
  # No total_timesteps: this stage will run until you stop it with Ctrl+C
  eval_freq: 50000
  log_root: "./experiments"
  seed: 42
  num_cpu: 30
  
  # --- Battle Training Parameters (triggers battle mode for this last stage) ---
  battle_step: 10_000_000      # Every battle_step, a new model challenges the pool.
  battle_cycles: 30         # 对战几个 cycle 后结束
  n_episodes_eval: 50      # Episodes per evaluation match.
  threshold_timesteps: 20_000_000  # Timesteps to reach to increase opponent difficulty(goal point to jsbsim).
  update_freq_episodes: 1000  # Episodes between opponent difficulty updates.

opponent_pool:
  base_dir: "./base_opponent_model"
  opponents: ["1", "2", "3"]
  whitelist: ["1", "2", "3"]          # 可省略
  pool_subdir: "opponent_pool"  # 位于实验目录下的对手池名称，可省略
  max_pool_size: 4          # Max opponents in the pool.